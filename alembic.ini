[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally absent. It is supplied at runtime by
# database/migrations/env.py from drugsim_core.config.Settings, so that the same
# secret-handling rules apply to migrations as to the application (TDS §7.6) —
# a database password does not belong in a committed ini file.

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
