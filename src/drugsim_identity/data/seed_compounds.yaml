# Which compounds the offline snapshot builder enriches with real PubChem
# data. This is a SCOPING list only -- it says which compounds are worth
# spending a lookup on, never what the answer is. The actual name,
# synonyms, and description always come from PubChem's real response at
# build time (scripts/build_compound_identity_snapshot.py), never written
# here by hand.
#
# `datasets/golden/compounds.csv`'s category=="drug" rows are included
# automatically by the build script (aspirin, caffeine, ibuprofen,
# paracetamol) and do not need to be repeated here. `imatinib_like` is
# deliberately excluded there and here -- its own name says it is a
# similar-shaped test structure, not literally imatinib.
#
# Entries below are the two DrugSim example compounds
# (frontend/src/lib/exampleCompounds.ts) that are NOT already covered by
# the golden fixture set, so all four examples end up identifiable.
compounds:
  - smiles: "CC(C)(C)c1ccc(cc1)C(O)CCCN1CCC(CC1)C(O)(c1ccccc1)c1ccccc1"
    note: "Terfenadine -- DrugSim example compound, not in datasets/golden/compounds.csv"
  - smiles: "CS(=O)(=O)Nc1ccc(cc1)CCN(C)CCOc1ccc(NS(C)(=O)=O)cc1"
    note: "Dofetilide -- DrugSim example compound, not in datasets/golden/compounds.csv"
  - smiles: "CCO"
    note: "Ethanol -- already in datasets/golden/compounds.csv but tagged category=simple, not category=drug, so the automatic golden-fixture inclusion above does not pick it up. Common and well-known enough to deserve identity resolution like any drug fixture."
  - smiles: "O"
    note: "Water -- same category=simple gap as ethanol above."
  - smiles: "C"
    note: "Methane -- same category=simple gap as ethanol above."
  - smiles: "c1ccccc1"
    note: "Benzene -- same gap, but category=aromatic rather than simple; same fix applies."

  # Common lab/industrial chemicals reference set (added 2026-08-30). Not
  # DrugSim golden fixtures or drug candidates -- ordinary, well-known
  # chemicals someone might reasonably type in (the way "phthalimide" was
  # found to be unidentified despite being a standard Gabriel-synthesis
  # reagent). Scoped deliberately to structures with NO stereochemistry
  # ambiguity -- a wrong SMILES here would mislabel a real compound, which
  # is worse than leaving it correctly "not identified". Sugars, amino
  # acids, and other stereochemistry-sensitive common compounds are
  # intentionally excluded from this batch for that reason.
  - smiles: "O=C1c2ccccc2C(=O)N1"
    note: "Phthalimide -- common synthesis reagent (Gabriel synthesis), the compound that surfaced this whole gap."
  - smiles: "CC(=O)C"
    note: "Acetone -- common solvent."
  - smiles: "CO"
    note: "Methanol -- common solvent."
  - smiles: "CC(C)O"
    note: "Isopropanol (rubbing alcohol) -- common solvent."
  - smiles: "CS(=O)C"
    note: "DMSO (dimethyl sulfoxide) -- common solvent."
  - smiles: "CN(C)C=O"
    note: "DMF (dimethylformamide) -- common solvent."
  - smiles: "C1CCOC1"
    note: "THF (tetrahydrofuran) -- common solvent."
  - smiles: "ClCCl"
    note: "Dichloromethane (DCM) -- common solvent."
  - smiles: "ClC(Cl)Cl"
    note: "Chloroform -- common solvent."
  - smiles: "CCOC(C)=O"
    note: "Ethyl acetate -- common solvent."
  - smiles: "Cc1ccccc1"
    note: "Toluene -- common solvent."
  - smiles: "CCCCCC"
    note: "Hexane -- common solvent."
  - smiles: "CCOCC"
    note: "Diethyl ether -- common solvent."
  - smiles: "CC#N"
    note: "Acetonitrile -- common solvent."
  - smiles: "CC(=O)O"
    note: "Acetic acid -- common acid (vinegar)."
  - smiles: "Cl"
    note: "Hydrochloric acid -- common acid."
  - smiles: "OS(=O)(=O)O"
    note: "Sulfuric acid -- common acid."
  - smiles: "[Na+].[OH-]"
    note: "Sodium hydroxide -- common base (lye)."
  - smiles: "N"
    note: "Ammonia."
  - smiles: "OC=O"
    note: "Formic acid."
  - smiles: "[BH4-].[Na+]"
    note: "Sodium borohydride -- common reducing-agent reagent."
  - smiles: "CCN(CC)CC"
    note: "Triethylamine -- common base/reagent (already a golden fixture as its HCl salt, not standalone)."
  - smiles: "NC(=O)N"
    note: "Urea."
  - smiles: "[Na+].OC([O-])=O"
    note: "Sodium bicarbonate (baking soda)."
  - smiles: "OO"
    note: "Hydrogen peroxide."
  - smiles: "O=C=O"
    note: "Carbon dioxide."
  - smiles: "N#N"
    note: "Nitrogen gas."
  - smiles: "O=O"
    note: "Oxygen gas."
  - smiles: "[C-]#[O+]"
    note: "Carbon monoxide."
  - smiles: "COc1cc(C=O)ccc1O"
    note: "Vanillin -- common flavor/fragrance compound."
  - smiles: "OCC(O)CO"
    note: "Glycerol (glycerin)."
  - smiles: "OCCO"
    note: "Ethylene glycol -- common antifreeze."
  - smiles: "C=O"
    note: "Formaldehyde."
  - smiles: "CC=O"
    note: "Acetaldehyde."
  - smiles: "Oc1ccccc1"
    note: "Phenol."
  - smiles: "c1ccc2ccccc2c1"
    note: "Naphthalene -- common mothball chemical."
  - smiles: "c1ccncc1"
    note: "Pyridine -- already a golden fixture (category=heterocycle, same auto-include gap as ethanol/water/methane/benzene)."
  - smiles: "c1cnc[nH]1"
    note: "Imidazole -- same golden-fixture gap as pyridine."
  - smiles: "c1ccc2[nH]ccc2c1"
    note: "Indole -- same golden-fixture gap as pyridine."
  - smiles: "c1ccoc1"
    note: "Furan -- same golden-fixture gap as pyridine."
  - smiles: "c1cc[nH]c1"
    note: "Pyrrole -- same golden-fixture gap as pyridine."
  - smiles: "NC(=N)N"
    note: "Guanidine -- already a golden fixture (category=functional_group), same gap."
  - smiles: "[K+].[Cl-]"
    note: "Potassium chloride -- common salt."
  - smiles: "[Ca+2].[O-]C([O-])=O"
    note: "Calcium carbonate -- common mineral (chalk, limestone)."
  - smiles: "[Na+].[Na+].[O-]S(=O)(=O)[O-]"
    note: "Sodium sulfate."
  - smiles: "[Mg+2].[O-]S(=O)(=O)[O-]"
    note: "Magnesium sulfate (Epsom salt)."
  - smiles: "NC(=O)c1cccnc1"
    note: "Nicotinamide (vitamin B3 / niacinamide) -- no stereocenters, safe to include."
  - smiles: "Nc1ccccc1"
    note: "Aniline."
  - smiles: "C=Cc1ccccc1"
    note: "Styrene."
  - smiles: "CC(N)=O"
    note: "Acetamide."
