# DrugSim deployment stack.
#
# Two independent groups of services, wired together only by this file, not
# by any runtime dependency between them:
#
#   * postgres / minio / minio-init -- the Phase 2 data platform (ETL,
#     compound/measurement storage). Sprint 2.1 scope, unchanged.
#   * predict-api / frontend -- the Phase 5/6 user-facing prediction
#     service and UI, added in Phase 8. predict-api uses its OWN SQLite
#     file (var/predictions.sqlite3, a bind-mounted volume below) for its
#     prediction audit log, NOT this postgres instance -- see
#     docs/phase8/phase8-deployment-report.md "PostgreSQL deployment" for
#     why that is a deliberate, existing decision (Phase 5), not an
#     oversight, and is left unchanged here per "do not redesign the
#     existing architecture unless a deployment requirement makes it
#     necessary."
#
# Credentials here are local-development only and are deliberately weak and obvious.
# Production secrets come from the secret manager / a real .env, never committed
# to this file (TDS §7.6, docs/phase8).

name: drugsim

services:
  postgres:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.postgres-rdkit
    image: drugsim/postgres-rdkit:local
    environment:
      POSTGRES_DB: drugsim
      POSTGRES_USER: drugsim
      POSTGRES_PASSWORD: drugsim_local_dev
      # Checksums detect silent on-disk corruption. Cheap here; a scientific
      # database that silently returns corrupted values is worse than one that
      # errors.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drugsim -d drugsim"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the data-lake buckets on first start, then exits.
  # Object versioning is enabled on the landing bucket: Z1 is write-once and its
  # retention is a scientific requirement, not a storage decision (TDS §10.5).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/drugsim-z1-landing &&
      mc mb --ignore-existing local/drugsim-z2-conformed &&
      mc mb --ignore-existing local/drugsim-z3-curated &&
      mc mb --ignore-existing local/drugsim-features &&
      mc mb --ignore-existing local/drugsim-artifacts &&
      mc version enable local/drugsim-z1-landing &&
      echo 'buckets ready'
      "

  # The user-facing prediction API (Phase 5/7/8). Independent of postgres/
  # minio above -- see the file-level comment.
  predict-api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.predict-api
    image: drugsim/predict-api:local
    environment:
      DRUGSIM_ENVIRONMENT: ${DRUGSIM_ENVIRONMENT:-local}
      DRUGSIM_LOG_LEVEL: ${DRUGSIM_LOG_LEVEL:-INFO}
      DRUGSIM_LOG_FORMAT: json
      # Empty by default (local/dev, open). MUST be set to a real,
      # generated key in staging/production -- the service refuses to
      # start otherwise (settings.assert_safe_to_start). Never commit a
      # real value; see .env.example.
      DRUGSIM_PREDICT_API_KEYS: ${DRUGSIM_PREDICT_API_KEYS:-}
      DRUGSIM_PREDICT_CORS_ALLOWED_ORIGINS: ${DRUGSIM_PREDICT_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
    volumes:
      # Named volume, not the git-tracked source tree -- the audit-log
      # SQLite file must survive a container replacement (see "Backups" in
      # docs/phase8), and must never be bind-mounted from a developer's
      # working copy in a real deployment.
      - predict_var:/app/var
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Static frontend + reverse proxy + TLS termination (Phase 6/8). See
  # deployment/caddy/Caddyfile for the placeholder domain and the
  # /api/* -> predict-api routing.
  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    image: drugsim/frontend:local
    environment:
      DRUGSIM_DOMAIN: ${DRUGSIM_DOMAIN:-:80}
    depends_on:
      predict-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy's own certificate/state storage, so a container restart does
      # not re-request a fresh Let's Encrypt certificate every time.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  predict_var:
  caddy_data:
  caddy_config:
